version: 2.1

orbs:
  # Updated to the modern version of the AWS CLI orb
  aws-cli: circleci/aws-cli@3.1.5
  bundle: toshimaru/bundle-install@0.3.1

references:
  container_config: &container_config
    working_directory: ~/www/
    docker:
      # Using the modern 'cimg' variant for better compatibility
      - image: cimg/ruby:3.0-node

jobs:
  build:
    <<: *container_config
    steps:
      - checkout
      - run:
          name: "Install correct Bundler version"
          command: gem install bundler:2.5.17
      - bundle/bundle-install
      - run:
          name: "Build site"
          command: bundle exec jekyll build --trace --lsi --strict_front_matter --profile
      # Using persist_to_workspace instead of save_cache for transferring files between jobs
      # This is the "proper" way to move your build files to the deploy job
      - persist_to_workspace:
          root: .
          paths:
            - _site

  deploy:
    <<: *container_config
    steps:
      - attach_workspace:
          at: .
      # Use the orb's built-in setup to handle credentials
      - aws-cli/setup:
          aws-access-key-id: AWS_ACCESS_KEY_ID
          aws-secret-access-key: AWS_SECRET_ACCESS_KEY
          aws-region: AWS_DEFAULT_REGION
      - run:
          name: "Deploy to S3"
          command: |
            # Sync everything EXCEPT CSS first to avoid type-clashing
            aws s3 sync _site "s3://$AWS_BUCKET_NAME" --delete --exclude "*.css"
            
            # Sync ONLY CSS and force the text/css type
            aws s3 sync _site "s3://$AWS_BUCKET_NAME" --exclude "*" --include "*.css" --content-type "text/css" --metadata-directive REPLACE
      - run:
          name: "Invalidate Cloudfront cache"
          command: aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - master