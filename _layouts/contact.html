---
layout: default
---

<div class="about-banner">
  <div class="container">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
  </div>
</div>

<div class="contact-page">
  <div class="container">
    <div class="contact-grid">

      <div class="contact-form-wrap">
        <form action="https://formsubmit.co/{{ site.email }}" method="POST" class="contact-form">
          <input type="hidden" name="_next" value="{{ site.url }}/thanks/">
          <input type="hidden" name="_captcha" value="false">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="tel">Telephone</label>
            <input type="tel" id="tel" name="tel" placeholder="Your phone number">
          </div>
          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="Town or area of the property">
          </div>
          <div class="form-group">
            <label for="referral">Where did you hear about us?</label>
            <select id="referral" name="referral">
              <option value="" disabled selected>Please select…</option>
              <option value="Search engine">Search engine</option>
              <option value="Social media">Social media</option>
              <option value="Word of mouth">Word of mouth</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="How can I help?" required></textarea>
          </div>
          <button type="submit" class="form-submit">Send Message</button>
        </form>
      </div>

      <div class="contact-details-wrap">
        <h3>How to contact us</h3>
        <p>I'd love to hear about your property and how I can help, please fill in the form or reach us directly:</p>
        <ul class="contact-info-list">
          <li>
            <span class="contact-info-label">Phone</span>
            <a href="tel:{{ site.phone | remove: ' ' }}">{{ site.phone }}</a>
          </li>
          <li>
            <span class="contact-info-label">Email</span>
            <a href="mailto:{{ site.email }}">{{ site.email }}</a>
          </li>
        </ul>
      </div>

    </div>
  </div>
</div>
