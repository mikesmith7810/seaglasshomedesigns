---
layout: default
---

<div class="about-banner">
  <div class="container">
    <h1>{{ page.title | default: "About Me" }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
  </div>
</div>

<div class="container">
  <div class="about-content">
    <div class="about-content-photo">
      {% if page.photo %}
        <img src="{{ page.photo | relative_url }}" alt="{{ page.name | default: site.title }}">
      {% else %}
        <div class="about-content-photo-placeholder"></div>
      {% endif %}
    </div>
    <div class="about-content-text">
      {{ content }}
    </div>
  </div>
</div>
